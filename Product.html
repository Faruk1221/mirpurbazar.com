
<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - Machinery Shop</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #172033;
            padding-bottom: 80px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            background: white;
            padding: 14px 15px;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #16a34a;
            font-size: 20px;
            font-weight: 800;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: #ecfdf3;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .header-cart {
            position: relative;
            font-size: 24px;
        }

        .cart-badge {
            position: absolute;
            top: -7px;
            right: -9px;
            min-width: 17px;
            height: 17px;
            padding: 0 4px;
            background: #dc2626;
            color: white;
            border-radius: 50%;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back {
            display: block;
            max-width: 1100px;
            margin: 15px auto;
            padding: 0 15px;
            color: #16a34a;
            font-weight: bold;
            font-size: 14px;
        }

        .product-container {
            max-width: 1100px;
            margin: 0 auto 20px;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        /* IMAGE AREA */

        .media-section {
            background: white;
            border-radius: 14px;
            border: 1px solid #eeeeee;
            padding: 10px;
        }

        .product-image-box {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .product-image-box img {
            width: 100%;
            height: 350px;
            object-fit: contain;
            display: block;
            cursor: zoom-in;
        }

        .product-placeholder {
            font-size: 110px;
        }

        .offer-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #dc2626;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            z-index: 5;
        }

        .gallery {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 2px 2px;
        }

        .gallery::-webkit-scrollbar {
            height: 4px;
        }

        .gallery-thumb {
            min-width: 72px;
            width: 72px;
            height: 72px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            background: #f8fafc;
            cursor: pointer;
        }

        .gallery-thumb.active {
            border-color: #16a34a;
        }

        .gallery-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* VIDEO */

        .video-section {
            margin-top: 15px;
        }

        .video-section h2 {
            font-size: 17px;
            margin-bottom: 10px;
        }

        .product-video {
            width: 100%;
            max-height: 420px;
            border-radius: 10px;
            background: #000;
            display: block;
        }

        .video-list {
            display: grid;
            gap: 12px;
        }

        /* PRODUCT INFO */

        .product-info {
            background: white;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid #eeeeee;
        }

        .product-info h1 {
            font-size: 22px;
            line-height: 1.35;
            margin-bottom: 4px;
        }

        .sub-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .rating {
            color: #f59e0b;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .price {
            color: #16a34a;
            font-size: 26px;
            font-weight: 800;
        }

        .old-price {
            color: #999;
            text-decoration: line-through;
            margin-top: 4px;
            font-size: 13px;
        }

        .stock {
            color: #16a34a;
            background: #f0fdf4;
            display: inline-block;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin: 15px 0;
        }

        .description {
            color: #555;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 18px;
        }

        .quantity-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .quantity {
            display: flex;
            align-items: center;
            width: fit-content;
            border: 1px solid #ddd;
            border-radius: 7px;
            overflow: hidden;
            margin-bottom: 18px;
        }

        .quantity button {
            width: 40px;
            height: 40px;
            border: none;
            background: #f3f4f6;
            font-size: 20px;
            cursor: pointer;
        }

        .quantity span {
            min-width: 45px;
            text-align: center;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .buttons button {
            border: none;
            border-radius: 8px;
            padding: 13px 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-btn {
            background: #f59e0b;
            color: white;
        }

        .buy-btn {
            background: #16a34a;
            color: white;
        }

        /* QUICK CHECKOUT FORM */
        .quick-checkout-box { 
            background: #f0fdf4; 
            border: 2px dashed #16a34a; 
            padding: 18px; 
            border-radius: 12px; 
            margin-top: 20px; 
        }
        .quick-checkout-box h3 { 
            font-size: 16px; 
            color: #16a34a; 
            margin-bottom: 12px; 
            text-align: center; 
            font-weight: 800; 
        }
        .form-group { 
            margin-bottom: 12px; 
        }
        .form-group label { 
            display: block; 
            font-size: 12px; 
            font-weight: bold; 
            margin-bottom: 4px; 
            color: #374151; 
        }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid #d1d5db; 
            border-radius: 6px; 
            font-size: 14px; 
            outline: none; 
        }
        .form-group input:focus { 
            border-color: #16a34a; 
        }
        .order-summary-mini { 
            background: white; 
            padding: 10px 12px; 
            border-radius: 6px; 
            font-size: 13px; 
            margin: 12px 0; 
            border: 1px solid #e5e7eb; 
        }
        .summary-line { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 4px; 
        }
        .summary-line.total { 
            font-weight: bold; 
            color: #16a34a; 
            border-top: 1px solid #eee; 
            padding-top: 6px; 
            margin-top: 4px;
            font-size: 15px; 
        }
        .confirm-order-btn { 
            width: 100%; 
            background: #25d366; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
        }

        .specifications {
            margin-top: 20px;
            background: #f9fafb;
            padding: 15px;
            border-radius: 10px;
        }

        .specifications h2 {
            font-size: 16px;
            margin-bottom: 10px;
            border-bottom: 2px solid #16a34a;
            padding-bottom: 5px;
            display: inline-block;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
        }

        .spec-row:last-child {

        }

        .spec-label {
            color: #666;
            text-transform: capitalize;
        }

        .spec-value {
            font-weight: bold;
            text-align: right;
        }

        /* RELATED */

        .related-section {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 15px 25px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 13px;
        }

        .section-title {
            font-size: 18px;

        }

        .view-all {

        }

        .related-products {
            display: grid;

        .related-card {

        .related-image {

        .related-image img {
            width: 100%;

        }

        .related-info {

        .related-info h3 {
            font-size: 13px;

        }

        .related-price {
            color: #16a34a;
            font-size: 15px;
            font-weight: 800;
            margin-top: 5px;
        }

        .related-btn {
            display: block;
            text-align: center;
            background: #16a34a;
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 8px;
        }

        footer {
            background: #172033;
            color: white;
            text-align: center;
            padding: 28px 15px;
        }

        footer h3 {
            color: #4ade80;
            margin-bottom: 8px;
        }

        footer p {
            color: #d1d5db;
            font-size: 12px;
            margin: 6px 0;
        }

        .bottom-nav {
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 10px;
            height: 62px;
            background: rgba(255,255,255,.97);
            border: 1px solid #e5e7eb;
            border-radius: 17px;
            box-shadow: 0 5px 25px rgba(0,0,0,.15);
            display: grid;
            grid-template-columns: repeat(5, 1fr);

        }

        .bottom-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 11px;

        }

        .bottom-item span {
            font-size: 21px;
            margin-bottom: 2px;
        }

        .bottom-item.active {

        }

        /* IMAGE MODAL */

        .image-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.9);
            z-index: 5000;
            align-items: center;

        .image-modal.show {

        }

        .image-modal img {
            max-width: 100%;

            object-fit: contain;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 18px;

            font-size: 35px;
            cursor: pointer;
        }

        @media (min-width: 768px) {

            .product-container {
                grid-template-columns: 1fr 1fr;
                align-items: start;
                padding-top: 10px;
            }

            .product-image-box {
                min-height: 450px;
            }

            .product-image-box img {

            }

            .bottom-nav {
                max-width: 500px;
                left: 50%;
                right: auto;
                transform: translateX(-50%);

        }
    </style>
</head>

    <span class="close-modal">×</span>

<script src="script.js"></script>

<script>

let selectedProduct = null;
let selectedQuantity = 1;
let selectedDeliveryCharge = 80;


/* GET PRODUCT ID */

function getProductId() {
    const params = new URLSearchParams(window.location.search);
    return params.get("id") || "";
}


/* FIND PRODUCT */

function findProduct() {
    if (
        typeof products === "undefined" ||
        !Array.isArray(products)
    ) {
        return null;
    }

    const id = getProductId();

    if (!id) {
        return products[0] || null;
    }

    return products.find(
        p => String(p.id) === String(id)
    ) || null;
}


/* PRODUCT IMAGE */

function getMainProductImage(product) {
    if (!product || !product.image) {
        return "";
    }
    return String(product.image);
}


/* GALLERY */

function getProductGallery(product) {
    let gallery = [];

    if (
        product &&
        Array.isArray(product.gallery)
    ) {
        gallery = product.gallery.filter(Boolean);
    }

    const mainImage = getMainProductImage(product);

    if (
        mainImage &&
        !gallery.includes(mainImage)
    ) {
        gallery.unshift(mainImage);
    }

    return gallery;
}


/* CHANGE MAIN IMAGE */

function changeMainImage(image, element) {
    const mainImage = document.getElementById("main-product-image");
    if (!mainImage) return;

    mainImage.src = image;

    document.querySelectorAll(".gallery-thumb").forEach(item => {
        item.classList.remove("active");
    });

    if (element) {
        element.classList.add("active");
    }
}


/* OPEN IMAGE */

function openImageModal(image) {
    const modal = document.getElementById("image-modal");
    const modalImage = document.getElementById("modal-image");

    if (!modal || !modalImage) return;

    modalImage.src = image;
    modal.classList.add("show");
}


/* CLOSE IMAGE */

function closeImageModal() {
    const modal = document.getElementById("image-modal");
    if (modal) {
        modal.classList.remove("show");
    }
}


/* GALLERY HTML */

function renderGallery(product) {
    const gallery = getProductGallery(product);

    if (!gallery.length) {
        return "";
    }

    return `
        <div class="gallery">
            ${gallery.map((image, index) => `
                <button
                    type="button"
                    class="gallery-thumb ${index === 0 ? "active" : ""}"
                    onclick="changeMainImage('${escapeAttribute(image)}', this)"
                >
                    <img
                        src="${escapeAttribute(image)}"
                        alt="Product image ${index + 1}"
                        loading="lazy"
                    >
                </button>
            `).join("")}
        </div>
    `;
}


/* VIDEO HTML */

function renderVideos(product) {
    let videos = [];

    if (
        product &&
        Array.isArray(product.videos)
    ) {
        videos = product.videos.filter(Boolean);
    }

    if (
        product &&
        product.video &&
        !videos.includes(product.video)
    ) {
        videos.push(product.video);
    }

    if (!videos.length) {
        return "";
    }

    return `
        <div class="video-section">
            <h2>🎥 Product Video</h2>
            <div class="video-list">
                ${videos.map(video => `
                    <video
                        class="product-video"
                        controls
                        preload="metadata"
                        playsinline
                    >
                        <source
                            src="${escapeAttribute(video)}"
                            type="video/mp4"
                        >
                        আপনার ব্রাউজার ভিডিওটি চালাতে পারছে না।
                    </video>
                `).join("")}
            </div>
        </div>
    `;
}


/* ESCAPE */

function escapeAttribute(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}


/* LOAD PRODUCT */

function loadProductDetails() {
    const container = document.getElementById("product-details");
    if (!container) return;

    selectedProduct = findProduct();
    selectedQuantity = 1;

    if (!selectedProduct) {
        container.innerHTML = `
            <div class="product-info">
                <h1>Product পাওয়া যায়নি</h1>
                <p class="description">
                    দুঃখিত, এই Product টি বর্তমানে পাওয়া যাচ্ছে না।
                </p>
                <a href="index.html" class="view-all">
                    ← হোমপেজে ফিরে যান
                </a>
            </div>
        `;

        const relSec = document.getElementById("related-section");
        if (relSec) relSec.style.display = "none";
        return;
    }

    const title = selectedProduct.bnName || selectedProduct.name;
    document.title = title + " - Machinery Shop";

    const priceText = selectedProduct.price > 0
        ? `৳ ${Number(selectedProduct.price).toLocaleString()}`
        : "দাম জানতে কল করুন";

    const oldPriceText = selectedProduct.oldPrice && selectedProduct.oldPrice > 0
        ? `<div class="old-price">৳ ${Number(selectedProduct.oldPrice).toLocaleString()}</div>`
        : "";

    const badgeText = selectedProduct.badge
        ? `<span class="offer-badge">${selectedProduct.badge}</span>`
        : "";

    const stockStatus = selectedProduct.status === "available"
        ? "ইন স্টক (In Stock)"
        : "আউট অফ Stock";

    const mainImage = getMainProductImage(selectedProduct);

    const imageHTML = mainImage
        ? `<img id="main-product-image" src="${escapeAttribute(mainImage)}" alt="${escapeAttribute(title)}" onclick="openImageModal(this.src)">`
        : `<div class="product-placeholder">⚙️</div>`;

    container.innerHTML = `
        <div>
            <div class="media-section">
                <div class="product-image-box">
                    ${badgeText}
                    ${imageHTML}
                </div>
                ${renderGallery(selectedProduct)}
                ${renderVideos(selectedProduct)}
            </div>
        </div>

        <div class="product-info">
            <h1>${title}</h1>

            ${selectedProduct.name !== selectedProduct.bnName
                ? `<div class="sub-title">${selectedProduct.name}</div>`
                : ""
            }

            <div class="rating">
                ⭐⭐⭐⭐⭐ (${selectedProduct.rating || 5})
            </div>

            <div class="price">
                ${priceText}
            </div>

            ${oldPriceText}

            <div class="stock">
                ● ${stockStatus}
            </div>

            <p class="description">
                ${selectedProduct.description || "এই পণ্যটি সম্পর্কে বিস্তারিত তথ্য জানতে আমাদের সাথে যোগাযোগ করুন।"}
            </p>

            <div class="quantity-title">
                পরিমাণ (Quantity)
            </div>

            <div class="quantity">
                <button type="button" onclick="changeProductQuantity(-1)">−</button>
                <span id="product-quantity">1</span>
                <button type="button" onclick="changeProductQuantity(1)">+</button>
            </div>

            <div class="buttons">
                <button class="cart-btn" type="button" onclick="addSelectedProductToCart()">
                    🛒 Add to Cart
                </button>
                <button class="buy-btn" type="button" onclick="scrollToOrderForm()">
                    ⚡ Buy Now
                </button>
            </div>

            <!-- DIRECT QUICK CHECKOUT FORM -->
            <div class="quick-checkout-box" id="quick-order-form">
                <h3>⚡ নাম ও ঠিকানা দিয়ে সরাসরি অর্ডার করুন</h3>
                
                <div class="form-group">
                    <label>আপনার নাম *</label>
                    <input type="text" id="cust-name" placeholder="আপনার নাম লিখুন">
                </div>

                <div class="form-group">
                    <label>মোবাইল নম্বর *</label>
                    <input type="tel" id="cust-phone" placeholder="১১ ডিজিটের মোবাইল নম্বর">
                </div>

                <div class="form-group">
                    <label>পূর্ণাঙ্গ ঠিকানা *</label>
                    <input type="text" id="cust-address" placeholder="জেলা, থানা ও এলাকার নাম লিখুন">
                </div>

                <div class="form-group">
                    <label>ডেলিভারি এরিয়া *</label>
                    <select id="cust-delivery" onchange="updateDeliveryCharge(this.value)">
                        <option value="80">ঢাকার ভেতরে (৳৮০)</option>
                        <option value="130">ঢাকার বাইরে (৳১৩০)</option>
                    </select>
                </div>

                <div class="order-summary-mini">
                    <div class="summary-line">
                        <span>পণ্যের দাম:</span>
                        <span id="summary-prod-price">৳ ${(selectedProduct.price * selectedQuantity).toLocaleString()}</span>
                    </div>
                    <div class="summary-line">
                        <span>ডেলিভারি চার্জ:</span>
                        <span id="summary-del-charge">৳ 80</span>
                    </div>
                    <div class="summary-line total">
                        <span>সর্বমোট:</span>
                        <span id="summary-total-price">৳ ${((selectedProduct.price * selectedQuantity) + 80).toLocaleString()}</span>
                    </div>
                </div>

                <button type="button" class="confirm-order-btn" onclick="submitQuickOrder()">
                    💬 WhatsApp-এ অর্ডার কনফার্ম করুন
                </button>
            </div>

            ${renderSpecifications(selectedProduct)}
        </div>
    `;

    loadRelatedProducts();
    updateCartCountUI();
}


/* SPECIFICATIONS */

function renderSpecifications(product) {
    let html = '<div class="specifications"><h2>Technical Specs & Details</h2>';

    if (product.seller) {
        html += `
            <div class="spec-row">
                <span class="spec-label">Seller</span>
                <span class="spec-value">${product.seller}</span>
            </div>
        `;
    }

    if (product.delivery) {
        html += `
            <div class="spec-row">
                <span class="spec-label">Delivery</span>
                <span class="spec-value">${product.delivery}</span>
            </div>
        `;
    }

    if (product.subCategory) {
        html += `
            <div class="spec-row">
                <span class="spec-label">Category</span>
                <span class="spec-value">${product.subCategory}</span>
            </div>
        `;
    }

    if (product.specifications && typeof product.specifications === "object") {
        Object.entries(product.specifications).forEach(([key, value]) => {
            html += `
                <div class="spec-row">
                    <span class="spec-label">${key}</span>
                    <span class="spec-value">${value}</span>
                </div>
            `;
        });
    }

    html += '</div>';
    return html;
}


/* QUANTITY & CALCULATION FUNCTIONS */

function changeProductQuantity(delta) {
    selectedQuantity = Math.max(1, selectedQuantity + delta);
    const qtySpan = document.getElementById("product-quantity");
    if (qtySpan) qtySpan.textContent = selectedQuantity;
    updateOrderSummary();
}

function updateDeliveryCharge(val) {
    selectedDeliveryCharge = parseInt(val) || 80;
    const delChargeSpan = document.getElementById("summary-del-charge");
    if (delChargeSpan) delChargeSpan.textContent = `৳ ${selectedDeliveryCharge}`;
    updateOrderSummary();
}

function updateOrderSummary() {
    if (!selectedProduct) return;
    const prodTotal = selectedProduct.price * selectedQuantity;
    const grandTotal = prodTotal + selectedDeliveryCharge;

    const prodSpan = document.getElementById("summary-prod-price");
    const totalSpan = document.getElementById("summary-total-price");

    if (prodSpan) prodSpan.textContent = `৳ ${prodTotal.toLocaleString()}`;
    if (totalSpan) totalSpan.textContent = `৳ ${grandTotal.toLocaleString()}`;
}

function scrollToOrderForm() {
    const form = document.getElementById("quick-order-form");
    if (form) form.scrollIntoView({ behavior: 'smooth' });
}


/* SUBMIT ORDER TO WHATSAPP */

function submitQuickOrder() {
    const name = document.getElementById("cust-name").value.trim();
    const phone = document.getElementById("cust-phone").value.trim();
    const address = document.getElementById("cust-address").value.trim();

    if (!name || !phone || !address) {
        alert("অনুগ্রহ করে আপনার নাম, মোবাইল নম্বর এবং ঠিকানা পূরণ করুন।");
        return;
    }

    const prodTitle = selectedProduct.bnName || selectedProduct.name;
    const prodTotal = selectedProduct.price * selectedQuantity;
    const grandTotal = prodTotal + selectedDeliveryCharge;

    const message = `*নতুন অর্ডার স্যার!* 📦\n\n` +
        `*প্রোডাক্ট:* ${prodTitle}\n` +
        `*পরিমাণ:* ${selectedQuantity} টি\n` +
        `*মূল্য:* ৳${prodTotal}\n` +
        `*ডেলিভারি চার্জ:* ৳${selectedDeliveryCharge}\n` +
        `*সর্বমোট:* ৳${grandTotal}\n\n` +
        `*কাস্টমার তথ্য:* \n` +
        `👤 নাম: ${name}\n` +
        `📞 ফোন: ${phone}\n` +
        `🏠 ঠিকানা: ${address}`;

    const whatsappNumber = "8801973317146";
    const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
    window.open(url, "_blank");
}


/* CART LOGIC */

function addSelectedProductToCart() {
    if (!selectedProduct) return;

    let cart = JSON.parse(localStorage.getItem("cart") || "[]");
    const existing = cart.find(item => String(item.id) === String(selectedProduct.id));

    if (existing) {
        existing.quantity = (existing.quantity || 1) + selectedQuantity;
    } else {
        cart.push({
            id: selectedProduct.id,
            name: selectedProduct.bnName || selectedProduct.name,
            price: selectedProduct.price,
            image: getMainProductImage(selectedProduct),
            quantity: selectedQuantity
        });
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCountUI();
    
    if (typeof showAddToCartToast === "function") {
        showAddToCartToast(selectedProduct.bnName || selectedProduct.name);
    } else {
        alert("পণ্যটি কার্টে যোগ করা হয়েছে!");
    }
}

function updateCartCountUI() {
    let cart = JSON.parse(localStorage.getItem("cart") || "[]");
    const totalCount = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
    const badge = document.getElementById("cart-count");
    if (badge) badge.textContent = totalCount;
}


/* RELATED PRODUCTS */

function loadRelatedProducts() {
    const relContainer = document.getElementById("related-products");
    if (!relContainer || typeof products === "undefined") return;

    const related = products
        .filter(p => String(p.id) !== String(selectedProduct.id))
        .slice(0, 4);

    if (!related.length) {
        const relSec = document.getElementById("related-section");
        if (relSec) relSec.style.display = "none";
        return;
    }

    relContainer.innerHTML = related.map(p => `
        <div class="related-card">
            <div class="related-image">
                ${p.image ? `<img src="${escapeAttribute(p.image)}" alt="${escapeAttribute(p.name)}">` : '⚙️'}
            </div>
            <div class="related-info">
                <h3>${p.bnName || p.name}</h3>
                <div class="related-price">৳ ${Number(p.price).toLocaleString()}</div>
                <a href="product.html?id=${p.id}" class="related-btn">বিস্তারিত দেখুন</a>
            </div>
        </div>
    `).join("");
}

// Initialize on page load
document.addEventListener("DOMContentLoaded", loadProductDetails);

</script>
